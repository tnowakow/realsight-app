<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="32" height="32" rx="6" fill="url(#skyGrad)"/>
  
  <!-- Back buildings (darker, smaller) -->
  <rect x="4" y="18" width="5" height="10" rx="1" fill="#1e293b" opacity="0.7"/>
  <rect x="23" y="16" width="5" height="12" rx="1" fill="#1e293b" opacity="0.7"/>
  
  <!-- Middle buildings -->
  <rect x="8" y="14" width="6" height="14" rx="1" fill="#334155"/>
  <rect x="18" y="12" width="7" height="16" rx="1" fill="#334155"/>
  
  <!-- Main building (tallest, emerald) -->
  <rect x="12" y="8" width="8" height="20" rx="1.5" fill="url(#buildingGrad)"/>
  
  <!-- Windows on main building -->
  <g fill="#a7f3d0" opacity="0.6">
    <rect x="14" y="10" width="1.5" height="2" rx="0.3"/>
    <rect x="18" y="10" width="1.5" height="2" rx="0.3"/>
    <rect x="14" y="14" width="1.5" height="2" rx="0.3"/>
    <rect x="18" y="14" width="1.5" height="2" rx="0.3"/>
    <rect x="14" y="18" width="1.5" height="2" rx="0.3"/>
    <rect x="18" y="18" width="1.5" height="2" rx="0.3"/>
  </g>
  
  <!-- Ground line -->
  <rect x="4" y="26" width="24" height="2" rx="1" fill="#0f172a"/>
</svg>
